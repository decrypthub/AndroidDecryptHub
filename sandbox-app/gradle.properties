org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# compileSdk 36 is newer than the AGP 8.7 tested max; suppress the warning.
android.suppressUnsupportedCompileSdk=36
# This repo lives under a non-ASCII path (…桌面文件备份3…). AGP's Windows path check aborts
# the build on non-ASCII dirs; the build itself works here, so opt out of the check.
android.overridePathCheck=true
